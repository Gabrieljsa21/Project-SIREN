[project]
name = "siren"
version = "0.4.0"
description = "Player de música pessoal (SIREN) - reprodução local via MPV/yt-dlp, com integração opcional ao Project ECHO."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "python-mpv>=1.0",
    "yt-dlp>=2024.8.6",
    "requests>=2.31",
    "python-dotenv",
    "winrt-runtime>=3.2.1",
    "winrt-windows-media>=3.2.1",
    "winrt-windows-media-playback>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-storage-streams>=3.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["siren*"]

# Lint: `uv run --extra dev ruff check siren tests scripts`. Só erros de
# verdade (nome indefinido, import sem uso, sintaxe), sem regras de estilo.
[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E9", "F"]

[project.scripts]
siren = "siren.main:main"
